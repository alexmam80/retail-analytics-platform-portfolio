<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Retail Analytics Platform architecture</title><desc id="desc">Five-layer architecture from data sources to platform operations.</desc>
