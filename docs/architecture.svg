<rect x="90" y="105" width="1020" height="76" rx="15" fill="#17345f" stroke="#4f8cff"/><text x="600" y="137" fill="#fff" font-size="22" font-weight="700">Data Sources</text><text x="600" y="163" fill="#b9cae5" font-size="16">CSV · Excel · MySQL · Synthetic demo data</text>
